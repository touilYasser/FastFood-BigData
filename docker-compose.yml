services:

  spark-master:
    build: .
    image: fastfood-spark:3.5.3
    hostname: spark-master

    entrypoint:
      - /opt/spark/bin/spark-class

    command:
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"

    ports:
      - "127.0.0.1:${SPARK_MASTER_PORT:-7077}:7077"
      - "127.0.0.1:${SPARK_MASTER_UI_PORT:-8080}:8080"

    networks:
      - fastfood-network


  spark-worker-1:
    image: fastfood-spark:3.5.3
    hostname: spark-worker-1

    depends_on:
      - spark-master

    entrypoint:
      - /opt/spark/bin/spark-class

    command:
      - org.apache.spark.deploy.worker.Worker
      - --cores
      - "2"
      - --memory
      - "1g"
      - --webui-port
      - "8081"
      - spark://spark-master:7077

    ports:
      - "127.0.0.1:${SPARK_WORKER_1_UI_PORT:-8081}:8081"

    networks:
      - fastfood-network


  spark-worker-2:
    image: fastfood-spark:3.5.3
    hostname: spark-worker-2

    depends_on:
      - spark-master

    entrypoint:
      - /opt/spark/bin/spark-class

    command:
      - org.apache.spark.deploy.worker.Worker
      - --cores
      - "2"
      - --memory
      - "1g"
      - --webui-port
      - "8081"
      - spark://spark-master:7077

    ports:
      - "127.0.0.1:${SPARK_WORKER_2_UI_PORT:-8082}:8081"

    networks:
      - fastfood-network


  kafka:
    image: apache/kafka:3.8.0
    hostname: kafka

    depends_on:
      kafka-volume-init:
        condition: service_completed_successfully

    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:29093

      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_PORT:-9092}

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_NUM_PARTITIONS: 3

      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs

      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"

    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka:29092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

    volumes:
      - kafka-data:/tmp/kraft-combined-logs

    networks:
      - fastfood-network


  kafka-volume-init:
    image: apache/kafka:3.8.0
    user: "0:0"
    entrypoint: ["chown"]
    command: ["1000:1000", "/tmp/kraft-combined-logs"]
    volumes:
      - kafka-data:/tmp/kraft-combined-logs

  kafka-init:
    image: apache/kafka:3.8.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/opt/kafka/bin/kafka-topics.sh"]
    command: ["--bootstrap-server", "kafka:29092", "--create", "--if-not-exists", "--topic", "orders", "--partitions", "3", "--replication-factor", "1"]
    networks:
      - fastfood-network

  minio:
    image: cgr.dev/chainguard/minio:latest
    hostname: minio

    user: "0:0"

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}

    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"

    volumes:
      - minio-data:/data

    networks:
      - fastfood-network

  minio-ready:
    image: fastfood-spark:3.5.3
    depends_on:
      minio:
        condition: service_started
    entrypoint: ["python3", "-c"]
    command:
      - |
        import time
        from urllib.request import urlopen
        from urllib.error import URLError
        for attempt in range(30):
            try:
                with urlopen("http://minio:9000/minio/health/ready", timeout=2):
                    break
            except (URLError, OSError) as error:
                if attempt == 29:
                    raise SystemExit(f"MinIO readiness failed: {error}")
                time.sleep(2)
    networks:
      - fastfood-network

  jupyter:
    image: fastfood-spark:3.5.3
    hostname: jupyter

    depends_on:
      spark-master:
        condition: service_started
      spark-worker-1:
        condition: service_started
      spark-worker-2:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
      minio-ready:
        condition: service_completed_successfully

    environment:
      FASTFOOD_UI_HOLD_SECONDS: ${FASTFOOD_UI_HOLD_SECONDS:-0}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}

    entrypoint:
      - python3
      - -m
      - notebook

    command:
      - --ip=0.0.0.0
      - --port=8888
      - --no-browser
      - --allow-root
      - --IdentityProvider.token=${JUPYTER_TOKEN:-fastfood}
      - --ServerApp.root_dir=/opt/project

    ports:
      - "127.0.0.1:${JUPYTER_PORT:-0}:8888"
      - "127.0.0.1:${SPARK_APP_UI_PORT:-4040}:4040"

    healthcheck:
      test: ["CMD", "python3", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8888/login', timeout=3).close()"]
      interval: 5s
      timeout: 5s
      retries: 12

    volumes:
      - ./:/opt/project
      - ivy-cache:/root/.ivy2

    networks:
      - fastfood-network


networks:
  fastfood-network:
    driver: bridge


volumes:
  kafka-data:
  minio-data:
  ivy-cache:
